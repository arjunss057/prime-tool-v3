[build-system]

requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]

name = "prime-tool-v3"
version = "0.1.0"
description = "A lightweight CLI for running remotely maintained Python scripts"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Arjun S"}
]
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only"
]

[project.scripts]
prime-tool-v3 = "primetoolv3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]